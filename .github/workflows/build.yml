name: QMK Build

on:
  push:
    branches: [main]
    paths:
      - 'FIRMWARE/**'
  pull_request:
    branches: [main]
    paths:
      - 'FIRMWARE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up VIAL-QMK
        run: |
          python3 -m pip install qmk
          qmk setup -y -b vial vial-kb/vial-qmk
      
      - name: Copy keyboard into QMK tree
        run: |
          mkdir -p ~/qmk_firmware/keyboards/electronlab
          cp -r ./FIRMWARE/qmk_rp2040/electronlab/klor ~/qmk_firmware/keyboards/electronlab/
      
      - name: Build Default Left
        run: qmk compile -kb electronlab/klor -km default -c -t uf2-split-left
      
      - name: Build Default Right
        run: qmk compile -kb electronlab/klor -km default -t uf2-split-right
      
      - name: Build VIAL Left
        run: qmk compile -kb electronlab/klor -km vial -c -t uf2-split-left
      
      - name: Build VIAL Right
        run: qmk compile -kb electronlab/klor -km vial -t uf2-split-right
      
      - name: Copy firmware artifacts to workspace
        if: always()
        run: |
          mkdir -p firmware-output
          find ~/qmk_firmware -name "*.uf2" -exec cp {} firmware-output/ \; 2>/dev/null || true
          find ~/qmk_firmware -name "*.bin" -exec cp {} firmware-output/ \; 2>/dev/null || true
      
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-builds
          path: |
            firmware-output/*.uf2
            firmware-output/*.bin
          if-no-files-found: ignore
